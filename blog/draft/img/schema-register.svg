<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.08"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8FB8E8"/>
    </marker>
    <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4FD1C5"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#0B2545"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g transform="translate(0,26)" font-family="Inter, sans-serif" font-size="20" font-weight="600">
    <!-- register -->
    <rect x="680" y="30" width="460" height="518" rx="18" fill="#0F2E55" stroke="#4FD1C5" stroke-width="2"/>
    <text x="710" y="66" fill="#4FD1C5" font-size="15" letter-spacing="2">SCHEMA-REGISTER</text>

    <!-- collections -->
    <rect x="710" y="84" width="400" height="210" rx="12" fill="#0B2545" fill-opacity="0.45" stroke="#2E5A8C" stroke-width="1.5"/>
    <text x="732" y="112" fill="#8FB8E8" font-size="15" font-weight="500">developer.overheid.nl</text>

    <rect x="710" y="314" width="400" height="210" rx="12" fill="#0B2545" fill-opacity="0.45" stroke="#2E5A8C" stroke-width="1.5"/>
    <text x="732" y="342" fill="#8FB8E8" font-size="15" font-weight="500">API Design Rules</text>

    <!-- local edges -->
    <path d="M222,326 L296,372" stroke="#8FB8E8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M400,354 L400,282" stroke="#8FB8E8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

    <!-- feedback loop: LLM <-> Validator -->
    <path d="M170,285 L170,186" stroke="#8FB8E8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M110,184 L110,283" stroke="#8FB8E8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

    <!-- LLM -> Generator (endpoint) -->
    <path d="M140,345 L140,444" stroke="#8FB8E8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

    <!-- $refs to register -->
    <path d="M487,250 L776,250" stroke="#4FD1C5" stroke-width="3" fill="none" marker-end="url(#arrowT)"/>
    <path d="M502,384 L776,384" stroke="#4FD1C5" stroke-width="3" fill="none" marker-end="url(#arrowT)"/>

    <!-- pulls from register -->
    <path d="M778,154 L226,154" stroke="#4FD1C5" stroke-width="3" stroke-dasharray="9 7" fill="none" marker-end="url(#arrowT)"/>
    <path d="M778,404 C600,452 280,470 198,350" stroke="#4FD1C5" stroke-width="3" stroke-dasharray="9 7" fill="none" marker-end="url(#arrowT)"/>

    <path d="M778,476 L226,476" stroke="#4FD1C5" stroke-width="3" stroke-dasharray="9 7" fill="none" marker-end="url(#arrowT)"/>

    <!-- internal register edge: BadRequest -> ProblemDetails -->
    <path d="M910,412 L910,446" stroke="#8FB8E8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

    <!-- local -->
    <rect x="315" y="222" width="170" height="56" rx="10" fill="#13335E" stroke="#8FB8E8" stroke-width="2"/>
    <text x="400" y="257" fill="#FFFFFF" text-anchor="middle">Repository</text>

    <rect x="300" y="356" width="200" height="56" rx="10" fill="#0B2545" stroke="#8FB8E8" stroke-width="2"/>
    <text x="400" y="390" fill="#C9D9EE" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-weight="400" font-size="19">openapi.json</text>

    <rect x="60" y="126" width="160" height="56" rx="28" fill="#0B2545" stroke="#8FB8E8" stroke-width="2"/>
    <text x="140" y="160" fill="#C9D9EE" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-weight="400" font-size="19">Validator</text>

    <rect x="60" y="287" width="160" height="56" rx="28" fill="#0B2545" stroke="#8FB8E8" stroke-width="2"/>
    <text x="140" y="321" fill="#C9D9EE" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-weight="400" font-size="19">LLM</text>

    <rect x="60" y="448" width="160" height="56" rx="28" fill="#0B2545" stroke="#8FB8E8" stroke-width="2"/>
    <text x="140" y="482" fill="#C9D9EE" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-weight="400" font-size="19">Codegen</text>

    <!-- register nodes -->
    <rect x="780" y="126" width="260" height="56" rx="10" fill="#13335E" stroke="#8FB8E8" stroke-width="2"/>
    <text x="910" y="161" fill="#FFFFFF" text-anchor="middle">PublicCode</text>

    <rect x="780" y="222" width="260" height="56" rx="10" fill="#13335E" stroke="#8FB8E8" stroke-width="2"/>
    <text x="910" y="257" fill="#FFFFFF" text-anchor="middle">Organisation</text>

    <rect x="780" y="356" width="260" height="56" rx="10" fill="#13335E" stroke="#8FB8E8" stroke-width="2"/>
    <text x="910" y="391" fill="#FFFFFF" text-anchor="middle">BadRequest</text>

    <rect x="780" y="448" width="260" height="56" rx="10" fill="#13335E" stroke="#8FB8E8" stroke-width="2"/>
    <text x="910" y="483" fill="#FFFFFF" text-anchor="middle">ProblemDetails</text>
  </g>
</svg>
