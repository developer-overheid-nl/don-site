<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="s1-title s1-desc">
  <title id="s1-title">Stap 1: wallet activeren</title>
  <desc id="s1-desc">De gebruiker kiest een zescijferige pincode, logt in met DigiD op niveau hoog en ontvangt zijn persoonsgegevens (PID) uit de Basisregistratie Personen in de wallet.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#01689b"/>
    </marker>
  </defs>

  <g font-family="RijksoverheidSansWebText, 'Segoe UI', Arial, sans-serif">
    <rect width="800" height="350" rx="16" fill="#eef7fb"/>

    <text x="40" y="52" font-size="22" font-weight="700" fill="#0f172a">Stap 1: wallet activeren</text>
    <text x="40" y="78" font-size="14" fill="#475569">Eenmalig: pincode kiezen, inloggen met DigiD en je PID ontvangen: je naam en geboortedatum.</text>

    <!-- DigiD -->
    <rect x="40" y="140" width="170" height="150" rx="12" fill="#ffffff" stroke="#b3d2e1" stroke-width="2"/>
    <rect x="90" y="165" width="70" height="46" rx="6" fill="#d9e8f0" stroke="#66a4c3" stroke-width="2"/>
    <circle cx="110" cy="183" r="8" fill="#01689b"/>
    <path d="M98,203 a12,9 0 0 1 24,0 z" fill="#01689b"/>
    <rect x="128" y="178" width="24" height="4" rx="2" fill="#66a4c3"/>
    <rect x="128" y="188" width="18" height="4" rx="2" fill="#66a4c3"/>
    <text x="125" y="250" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">DigiD</text>
    <text x="125" y="270" font-size="11" fill="#475569" text-anchor="middle">niveau hoog</text>

    <!-- Pijlen links -->
    <line x1="333" y1="190" x2="214" y2="190" stroke="#01689b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="272" y="180" font-size="12" fill="#334155" text-anchor="middle">2. Inloggen</text>
    <line x1="214" y1="240" x2="333" y2="240" stroke="#01689b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="272" y="260" font-size="12" fill="#334155" text-anchor="middle">3. Bevestigd</text>

    <!-- Telefoon -->
    <rect x="335" y="110" width="130" height="220" rx="18" fill="#1e293b"/>
    <rect x="343" y="120" width="114" height="192" rx="10" fill="#ffffff"/>
    <rect x="343" y="120" width="114" height="28" rx="10" fill="#01689b"/>
    <rect x="343" y="136" width="114" height="12" fill="#01689b"/>
    <text x="353" y="139" font-size="11" font-weight="700" fill="#ffffff">NL Wallet</text>
    <rect x="380" y="318" width="40" height="4" rx="2" fill="#64748b"/>

    <text x="400" y="168" font-size="11" fill="#1e293b" text-anchor="middle">1. Kies je pincode</text>
    <g fill="#01689b">
      <circle cx="365" cy="183" r="5"/>
      <circle cx="379" cy="183" r="5"/>
      <circle cx="393" cy="183" r="5"/>
      <circle cx="407" cy="183" r="5"/>
      <circle cx="421" cy="183" r="5"/>
      <circle cx="435" cy="183" r="5"/>
    </g>

    <rect x="353" y="204" width="94" height="58" rx="6" fill="#ddeff8" stroke="#8fcae7" stroke-width="1.5"/>
    <text x="362" y="222" font-size="11" font-weight="700" fill="#01496d">PID</text>
    <text x="362" y="238" font-size="10" fill="#1e293b">Naam</text>
    <text x="362" y="252" font-size="10" fill="#1e293b">Geboortedatum</text>
    <circle cx="436" cy="217" r="8" fill="#39870c"/>
    <path d="M432,217 l3,3 l5,-6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="400" y="290" font-size="11" font-weight="700" fill="#39870c" text-anchor="middle">Geactiveerd</text>

    <!-- Pijl rechts -->
    <line x1="588" y1="215" x2="469" y2="215" stroke="#01689b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="528" y="205" font-size="12" fill="#334155" text-anchor="middle">4. PID naar wallet</text>

    <!-- BRP -->
    <rect x="590" y="140" width="170" height="150" rx="12" fill="#ffffff" stroke="#b3d2e1" stroke-width="2"/>
    <path d="M641,170 v42 a34,9 0 0 0 68,0 v-42" fill="#d9e8f0" stroke="#66a4c3" stroke-width="2"/>
    <path d="M641,191 a34,9 0 0 0 68,0" fill="none" stroke="#66a4c3" stroke-width="2"/>
    <ellipse cx="675" cy="170" rx="34" ry="9" fill="#b3d2e1" stroke="#66a4c3" stroke-width="2"/>
    <text x="675" y="250" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">BRP</text>
    <text x="675" y="270" font-size="11" fill="#475569" text-anchor="middle">Basisregistratie Personen</text>
  </g>
</svg>
