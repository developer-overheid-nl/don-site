<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="s4-title s4-desc">
  <title id="s4-title">Stap 4: verificatie</title>
  <desc id="s4-desc">De ontvanger controleert de handtekening van de uitgever op het gedeelde kaartje en vraagt bij de uitgever, bijvoorbeeld de RDW, na of het kaartje nog geldig is. De uitgever ziet daarbij niet om welk kaartje het gaat.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#01689b"/>
    </marker>
  </defs>

  <g font-family="RijksoverheidSansWebText, 'Segoe UI', Arial, sans-serif">
    <rect width="800" height="350" rx="16" fill="#eef7fb"/>

    <text x="40" y="52" font-size="22" font-weight="700" fill="#0f172a">Stap 4: verificatie</text>
    <text x="40" y="78" font-size="14" fill="#475569">De ontvanger controleert de handtekening en checkt bij de uitgever of het kaartje nog geldig is.</text>

    <!-- Ontvanger -->
    <rect x="70" y="110" width="250" height="210" rx="12" fill="#ffffff" stroke="#b3d2e1" stroke-width="2"/>
    <text x="195" y="142" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Ontvanger</text>
    <text x="195" y="160" font-size="11" fill="#475569" text-anchor="middle">bijvoorbeeld een autoverhuurder</text>

    <rect x="92" y="176" width="206" height="62" rx="8" fill="#f7d9e7" stroke="#e78cb6" stroke-width="1.5"/>
    <text x="106" y="198" font-size="11" font-weight="700" fill="#1e293b">Rijbewijs</text>
    <rect x="106" y="208" width="80" height="5" rx="2" fill="#e78cb6"/>
    <rect x="106" y="219" width="56" height="5" rx="2" fill="#e78cb6"/>
    <circle cx="274" cy="207" r="12" fill="#01689b"/>
    <path d="M268.5,207 l3.5,3.5 l6.5,-7.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="100" cy="262" r="8" fill="#39870c"/>
    <path d="M96.5,262 l2.5,2.5 l4.5,-5.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="114" y="266" font-size="12" font-weight="700" fill="#39870c">Handtekening uitgever klopt</text>
    <circle cx="100" cy="290" r="8" fill="#39870c"/>
    <path d="M96.5,290 l2.5,2.5 l4.5,-5.5" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="114" y="294" font-size="12" font-weight="700" fill="#39870c">Kaartje nog geldig</text>

    <!-- Geldigheidscheck -->
    <line x1="324" y1="190" x2="476" y2="190" stroke="#01689b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="400" y="180" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Nog geldig?</text>
    <line x1="476" y1="250" x2="324" y2="250" stroke="#01689b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="400" y="270" font-size="13" fill="#334155" text-anchor="middle">Ja, geldig</text>

    <!-- Uitgever -->
    <rect x="480" y="110" width="250" height="210" rx="12" fill="#ffffff" stroke="#b3d2e1" stroke-width="2"/>
    <text x="605" y="142" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">Uitgever</text>
    <text x="605" y="160" font-size="11" fill="#475569" text-anchor="middle">bijvoorbeeld de RDW</text>

    <path d="M563,200 L605,176 L647,200 z" fill="#01689b"/>
    <g fill="#d9e8f0" stroke="#66a4c3" stroke-width="2">
      <rect x="569" y="204" width="10" height="30" rx="1"/>
      <rect x="586" y="204" width="10" height="30" rx="1"/>
      <rect x="614" y="204" width="10" height="30" rx="1"/>
      <rect x="631" y="204" width="10" height="30" rx="1"/>
    </g>
    <rect x="561" y="236" width="88" height="7" rx="2" fill="#01689b"/>

    <text x="605" y="280" font-size="12" fill="#475569" text-anchor="middle">ziet niet welk kaartje</text>
  </g>
</svg>
