name: Deploy to Production

# De productie-image wordt gebouwd en gepusht door de Build-workflow.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: developer-overheid-nl/.github/.github/workflows/deploy.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      environment: prod
      infra-repo: ${{ vars.INFRA_REPO }}
      kustomize-path: ${{ vars.KUSTOMIZE_PATH }}
      images: '[{"name": "ghcr.io/developer-overheid-nl/don-site", "target": "caddy"}]'
      build: false
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit
