name: Deploy to Test

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - "changeset-release/**"
      - "changesets-ghcommit-temp/**"

jobs:
  deploy:
    uses: developer-overheid-nl/.github/.github/workflows/deploy.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      environment: test
      infra-repo: ${{ vars.INFRA_REPO }}
      kustomize-path: ${{ vars.KUSTOMIZE_PATH }}
      images: '[{"name": "ghcr.io/developer-overheid-nl/don-site", "target": "caddy"}]'
    secrets:
      RELEASE_PROCES_APP_ID: ${{ secrets.RELEASE_PROCES_APP_ID }}
      RELEASE_PROCES_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PROCES_APP_PRIVATE_KEY }}
      # Typesense- en events-key zijn read-only en komen in publieke browser-JavaScript.
      BUILD_SECRETS: |
        "PIWIK_PRO_ACCOUNT_ADDRESS=${{ secrets.PIWIK_PRO_ACCOUNT_ADDRESS }}"
        "PIWIK_PRO_SITE_ID=${{ secrets.PIWIK_PRO_SITE_ID }}"
        "TYPESENSE_ENDPOINT=https://search.don.projects.digilab.network"
        "TYPESENSE_API_KEY=NFzpPqCWAFE1133lkURBFaXz7Q0H1LXi"
        "EVENTS_API_URL=https://api.don.projects.digilab.network/tools/v1"
        "EVENTS_API_KEY=${{ secrets.EVENTS_API_KEY_TEST }}"
